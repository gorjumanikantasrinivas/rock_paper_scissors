<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">

  <h1>Rock · Paper · Scissors</h1>
  <p class="subtitle">Pick your move — beat the machine</p>

  <div class="scoreboard">
    <div class="score-card win">
      <div class="score-label">You</div>
      <div class="score-val" id="sc-you">0</div>
    </div>
    <div class="score-card">
      <div class="score-label">Ties</div>
      <div class="score-val" id="sc-tie">0</div>
    </div>
    <div class="score-card lose">
      <div class="score-label">CPU</div>
      <div class="score-val" id="sc-cpu">0</div>
    </div>
  </div>

  <div class="choices">
    <button class="choice-btn" onclick="play('rock')" aria-label="Rock">
      🪨<span class="label">Rock</span>
    </button>
    <button class="choice-btn" onclick="play('paper')" aria-label="Paper">
      📄<span class="label">Paper</span>
    </button>
    <button class="choice-btn" onclick="play('scissors')" aria-label="Scissors">
      ✂️<span class="label">Scissors</span>
    </button>
  </div>

  <div class="arena" id="arena">
    <p class="idle-msg">Choose a move to start ↑</p>
  </div>

  <div class="history-row" id="history"></div>

  <button class="reset-btn" onclick="resetGame()">Reset scores</button>

</div>
<script src="script.js"></script>
</body>
</html>
